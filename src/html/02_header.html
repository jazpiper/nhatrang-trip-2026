  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <!-- Brand Logo -->
      <a href="#" class="brand-logo" title="나트랑 로컬 가이드">
        <span class="logo-icon">🌴</span>
        <span>Nha Trang</span>
      </a>

      <!-- Center Tabs (Activities, Gourmet, Stays, Spa, Shopping, Currency) -->
      <nav class="header-nav-tabs" aria-label="메인 카테고리">
        <button class="nav-tab-btn active" data-tab="activities">
          <span>🤿 액티비티</span>
          <span class="tab-badge" data-count-for="activity">32</span>
        </button>
        <button class="nav-tab-btn" data-tab="gourmet">
          <span>🍜 맛집</span>
          <span class="tab-badge">113</span>
        </button>
        <button class="nav-tab-btn" data-tab="stays">
          <span>🏨 숙소</span>
          <span class="tab-badge">24</span>
        </button>
        <button class="nav-tab-btn" data-tab="hoteldining">
          <span>🍽️ 호텔 다이닝</span>
          <span class="tab-badge" data-count-for="hoteldining">24</span>
        </button>
        <button class="nav-tab-btn" data-tab="spa">
          <span>💆 스파</span>
          <span class="tab-badge" data-count-for="spa">24</span>
        </button>
        <button class="nav-tab-btn" data-tab="shopping">
          <span>🛍️ 쇼핑</span>
          <span class="tab-badge">18</span>
        </button>
        <button class="nav-tab-btn" data-tab="currency">
          <span>💱 환전</span>
          <span class="tab-badge">17</span>
        </button>
        <button class="nav-tab-btn" data-tab="guide">
          <span>💡 꿀팁 & 가이드</span>
          <span class="tab-badge" data-count-for="guide">4대 가이드</span>
        </button>
      </nav>

      <!-- Right Action Tools -->
      <div class="header-actions">
        <!-- Currency Converter Toggle -->
        <button class="action-pill-btn" id="openCalcBtn" title="동/원화 간편 환율 계산기">
          <span>💱</span>
          <span>환율 계산</span>
        </button>

        <!-- Weather & Tip Guide -->
        <button class="action-pill-btn" id="openGuideBtn" title="나트랑 날씨 & 여행 꿀팁">
          <span>💡</span>
          <span>가이드</span>
        </button>

        <!-- Wishlist Toggle -->
        <button class="action-pill-btn wishlist-btn" id="wishlistToggleBtn" title="찜한 항목 모아보기">
          <span>♥</span>
          <span>찜</span>
          <span class="wishlist-count" id="wishlistCount">0</span>
        </button>
      </div>
    </div>
  </header>
