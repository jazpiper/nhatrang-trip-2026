name: Auto Approve and Merge Jules PR

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]

jobs:
  auto-merge:
    if: |
      startsWith(github.head_ref, 'jules-') || 
      startsWith(github.head_ref, 'jules/') ||
      contains(github.event.pull_request.user.login, 'jules')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Approve and Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --approve --body "🤖 Verified by Autonomous CI Pipeline." || echo "Approval skipped or already self-authored."
          gh pr merge "$PR_URL" --auto --squash || gh pr merge "$PR_URL" --squash
